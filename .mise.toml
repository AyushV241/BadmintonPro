# Mise configuration for BadmintonPro development
# https://mise.jdx.dev/

[tools]
go = "1.26"
air = "latest"

[tasks.server]
description = "Start API server with hot reload (port 8080)"
dir = "backend"
run = "air"

[tasks.web]
description = "Start Next.js frontend (port 3000)"
dir = "frontend"
run = "npm run dev"

[tasks.dev]
description = "Start backend and frontend together"
depends = ["server", "web"]
